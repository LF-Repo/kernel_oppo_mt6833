name: 编译内核（可配置 KernelSU / LXC-Docker / KVM / BPF）

on:
  workflow_dispatch:
    inputs:
      enable_kernelsu:
        description: '启用 KernelSU 支持'
        required: false
        default: false
        type: boolean
      enable_lxc_docker:
        description: '启用 LXC / Docker 支持（需配合 KernelSU）'
        required: false
        default: false
        type: boolean
      enable_kvm:
        description: '启用 KVM 支持'
        required: false
        default: false
        type: boolean
      enable_bpf:
        description: 'BPF修复'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建编译内核环境
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: 下载 Gcc 编译器
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir gcc64
          wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
          mkdir gcc32
          wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxvf gcc-arm.tar.gz

      - name: 下载 Clang 编译器
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir clang-aosp
          git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

      - name: 下载内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/LF-Repo/kernel_oppo_mt6833 android-kernel
          cd android-kernel

      - name: 设置 ccache 缓存
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-oppo-mt6833
          max-size: 2G

      - name: KernelSU - 应用 legacy patch
        if: inputs.enable_kernelsu == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          wget https://github.com/rksuorg/kernel_patches/raw/master/manual_hook/kernel-4.14.patch -O ksu-4.14.patch
          patch -p1 < ksu-4.14.patch

      - name: KernelSU - 植入 KSU 核心
        if: inputs.enable_kernelsu == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash

      - name: LXC/Docker - 开启内核配置
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://github.com/wu17481748/lxc-docker/releases/download/lxc-docker-2config/LXC-DOCKER-OPEN-CONFIG.sh
          chmod +x LXC-DOCKER-OPEN-CONFIG.sh
          ./LXC-DOCKER-OPEN-CONFIG.sh android-kernel/arch/arm64/configs/PFGM00_defconfig -w

      - name: LXC/Docker - 禁用 task_turbo 模块
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          sed -i '/CONFIG_MTK_TASK_TURBO/d' arch/arm64/configs/PFGM00_defconfig
          echo "# CONFIG_MTK_TASK_TURBO is not set" >> arch/arm64/configs/PFGM00_defconfig

      - name: LXC/Docker - 打入 runc 补丁
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://raw.githubusercontent.com/tomxi1997/lxc-docker-support-for-android/refs/heads/main/runcpatch.sh
          chmod +x runcpatch.sh
          if [ -f android-kernel/kernel/cgroup.c ]; then
            ./runcpatch.sh android-kernel/kernel/cgroup.c
          fi
          if [ -f android-kernel/kernel/cgroup/cgroup.c ]; then
            ./runcpatch.sh android-kernel/kernel/cgroup/cgroup.c
          fi

      - name: LXC/Docker - 打入 xt_qtaguid 补丁
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ -f android-kernel/net/netfilter/xt_qtaguid.c ]; then
            wget https://github.com/wu17481748/lxc-docker/releases/download/lxc/lxc.patch
            patch -p0 < lxc.patch
          fi

      - name: LXC/Docker - 关闭 ANDROID_PARANOID_NETWORK
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/PFGM00_defconfig

      - name: KVM - 开启配置
        if: inputs.enable_kvm == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          echo "CONFIG_VIRTUALIZATION=y" >> android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "CONFIG_KVM=y" >> android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "CONFIG_VHOST_NET=y" >> android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y" >> android-kernel/arch/arm64/configs/PFGM00_defconfig

      - name- name: 清理 BPF 补丁引入的重复定义
        if: inputs.enable_bpf == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel


          # ---------- 创建并应用修复补丁 ----------
          cat > fix-bpf-verifier.patch <<'EOF'
--- a/kernel/bpf/verifier.c
+++ b/kernel/bpf/verifier.c
@@ -1,3 +1,4 @@
+
 /* Copyright (c) 2011-2014 PLUMgrid, http://plumgrid.com
  * Copyright (c) 2016 Facebook
  *
@@ -30,6 +31,15 @@
 #include <linux/vmalloc.h>
 #include <linux/stringify.h>
 
+/* REASON_* for sanitize_ptr_alu */
+enum {
+	REASON_BOUNDS,
+	REASON_TYPE,
+	REASON_PATHS,
+	REASON_LIMIT,
+	REASON_STACK,
+};
+
 /* bpf_check() is a static code analyzer that walks eBPF program
  * instruction by instruction and updates register/stack state.
  * All paths of conditional branches are analyzed until 'bpf_exit' insn.
@@ -1926,6 +1936,7 @@
 	u32 alu_state, alu_limit;
 	struct bpf_reg_state tmp;
 	bool ret;
+	int err;
 
 	if (can_skip_alu_sanitation(env, insn))
 		return 0;
@@ -1944,11 +1955,11 @@
 		return REASON_BOUNDS;
 
 	info->mask_to_left = (opcode == BPF_ADD &&  off_is_neg) ||
-			     (opcode == BPF_SUB && !off_is_neg);
+			     (opcode == BPF_SUB && !off_is_neg);
 
 	err = retrieve_ptr_limit(ptr_reg, &alu_limit, info->mask_to_left);
 	if (err < 0)
-		return err;
+		goto do_sim_sanitize;
 
 	if (commit_window) {
 		/* In commit phase we narrow the masking window based on
@@ -1968,15 +1979,10 @@
 	err = update_alu_sanitation_state(aux, alu_state, alu_limit);
 	if (err < 0)
 		return err;
-do_sim:
-	/* If we're in commit phase, we're done here given we already
-	 * pushed the truncated dst_reg into the speculative verification
-	 * stack.
-	 *
-	 * Also, when register is a known constant, we rewrite register-based
-	 * operation to immediate-based, and thus do not need masking (and as
-	 * a consequence, do not need to simulate the zero-truncation either).
-	 */
+	goto do_sim_sanitize;
+
+do_sim_sanitize:
+	/* Simulate the effect of masking for speculative execution */
 	if (commit_window || off_is_imm)
 		return 0;
 	if (update_alu_sanitation_state(aux, alu_state, alu_limit))
@@ -2076,6 +2082,8 @@
 	struct bpf_sanitize_info info = {};
 	u8 opcode = BPF_OP(insn->code);
 	int ret;
+	u32 dst = insn->dst_reg;
+	u32 src = insn->src_reg;
 
 	dst_reg = &regs[dst];
 
@@ -4890,6 +4898,8 @@
 			u32 off_reg;
 
 			aux = &env->insn_aux_data[i + delta];
+			bool isimm = aux->alu_state & BPF_ALU_IMMEDIATE;
+
 			if (!aux->alu_state ||
 			    aux->alu_state == BPF_ALU_NON_POINTER)
 				continue;
--- a/include/linux/bpf_verifier.h
+++ b/include/linux/bpf_verifier.h
@@ -13,6 +13,7 @@
 #define BPF_ALU_SANITIZE_SRC		1U
 #define BPF_ALU_SANITIZE_DST		2U
 #define BPF_ALU_NEG_VALUE		(1U << 2)
+#define BPF_ALU_IMMEDIATE		(1U << 4)
 #define BPF_ALU_NON_POINTER		(1U << 3)
 #define BPF_ALU_SANITIZE		(BPF_ALU_SANITIZE_SRC | \
 					 BPF_ALU_SANITIZE_DST)
EOF

          # 应用补丁
          patch -p1 < fix-bpf-verifier.patch

          # ---------- 其他原有清理（如果需要） ----------
          # 1. kernel.h: 删声明，保留定义
          sed -i '/^u32 int_sqrt64(u64 x);$/d' include/linux/kernel.h

          # 2. list_lru.h: 删除第二个 struct rcu_head rcu
          awk '
          /struct rcu_head[[:space:]]*rcu/ { if(++c>1) next }
          1
          ' include/linux/list_lru.h > tmp && mv tmp include/linux/list_lru.h

          # 3. vmpressure.h: 直接恢复补丁前的原始版本
          git checkout -- include/linux/vmpressure.h

          # 4. bpf/core.c: 添加缺失的声明
          sed -i '/^long bpf_jit_limit.*__read_mostly;$/a\static u64 bpf_jit_limit_max;' kernel/bpf/core.c

          echo "BPF 补丁清理完成（已应用 verifier 修复补丁）"



      - name: 开始编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
          export KBUILD_BUILD_HOST=AndroidDeveloper@Android.com
          export KBUILD_BUILD_USER=AndroidDeveloper
          if [ "${{ inputs.enable_lxc_docker }}" = "true" ]; then
            KCFLAGS_EXTRA="-Wno-error=sizeof-array-div"
          else
            KCFLAGS_EXTRA=""
          fi
          make -s -j$(nproc --all) O=out ARCH=arm64 PFGM00_defconfig
          make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            KCFLAGS="$KCFLAGS_EXTRA"

      - name: 制作 AnyKernel3 卡刷包
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

      - name: 上传 AnyKernel3 包
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel.zip
          path: kernel_workspace/AnyKernel3/*

      - name: 上传内核镜像
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
